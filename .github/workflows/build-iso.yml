name: Build SMOL ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout SMOL
        uses: actions/checkout@v4
      - name: Inspect builder resources
        run: |
          df -h
          docker --version
      - name: Build using Debian 13 live-build
        run: |
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${PWD}:/src" -w /src \
            debian:trixie /bin/bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                grub-efi-amd64-bin grub-pc-bin \
                curl ca-certificates git file python3
              bash scripts/validate-layout.sh
              bash scripts/build-iso.sh
            '
      - name: Check ISO and checksum
        run: |
          test -s dist/smol-trixie-amd64-live.iso
          (cd dist && sha256sum --check smol-trixie-amd64-live.iso.sha256)
          file dist/smol-trixie-amd64-live.iso
      - name: Report ISO size
        run: |
          bytes=$(stat -c '%s' dist/smol-trixie-amd64-live.iso)
          mib=$(awk -v bytes="$bytes" 'BEGIN {printf "%.1f",bytes/1048576}')
          mb=$(awk -v bytes="$bytes" 'BEGIN {printf "%.1f",bytes/1000000}')
          {
            echo '### SMOL ISO size'
            echo "Actual image: **${mb} MB** (${mib} MiB, ${bytes} bytes)"
            echo 'Target: 700 MB (700,000,000 bytes)'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( bytes > 700000000 )); then
            echo "::warning::ISO exceeds 700 MB size goal: ${mb} MB"
            echo '**Target not yet met.** More optimization is needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**700 MB size goal met!**' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload boot-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: smol-trixie-amd64-live
          path: |
            dist/smol-trixie-amd64-live.iso
            dist/smol-trixie-amd64-live.iso.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
